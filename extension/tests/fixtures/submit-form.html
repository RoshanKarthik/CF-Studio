<!doctype html>
<!-- Written for the tests; mimics the structure of Codeforces' contest submit page. -->
<html>
  <head>
    <meta name="X-Csrf-Token" content="0123456789abcdef0123456789abcdef" />
  </head>
  <body>
    <div class="lang-chooser">
      <a href="/profile/test_user">test_user</a> | <a href="/0123abcd/logout">Logout</a>
    </div>
    <form action="/search" method="post">
      <input type="hidden" name="csrf_token" value="0123456789abcdef0123456789abcdef" />
      <input name="query" />
    </form>
    <form class="submit-form" method="post" action="/contest/1000/submit?csrf_token=0123456789abcdef0123456789abcdef" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="0123456789abcdef0123456789abcdef" />
      <input type="hidden" name="ftaa" value="abcdefghijklmnopqr" />
      <input type="hidden" name="bfaa" value="00112233445566778899aabbccddeeff" />
      <input type="hidden" name="action" value="submitSolutionFormSubmitted" />
      <table class="table-form">
        <tr>
          <td>Problem:</td>
          <td>
            <select name="submittedProblemIndex">
              <option value="">Choose problem</option>
              <option value="A">A - First Problem</option>
              <option value="B">B - Second Problem</option>
              <option value="C1">C1 - Third Problem (easy)</option>
            </select>
            <span class="error for__submittedProblemIndex"></span>
          </td>
        </tr>
        <tr>
          <td>Language:</td>
          <td>
            <select name="programTypeId">
              <option value="43">GNU GCC C11 5.1.0</option>
              <option value="80">Clang++20 Diagnostics</option>
              <option value="52">Clang++17 Diagnostics</option>
              <option value="50">GNU G++14 6.4.0</option>
              <option value="54" selected="selected">GNU G++17 7.3.0</option>
              <option value="89">GNU G++20 13.2 (64 bit, winlibs)</option>
              <option value="91">GNU G++23 14.2 (64 bit, msys2)</option>
              <option value="65">C# 8, .NET Core 3.1</option>
              <option value="36">Java 8 32bit</option>
              <option value="60">Java 11.0.6</option>
              <option value="87">Java 21 64bit</option>
              <option value="7">Python 2.7.18</option>
              <option value="31">Python 3.8.10</option>
              <option value="40">PyPy 2.7.13 (7.3.0)</option>
              <option value="41">PyPy 3.6.9 (7.3.0)</option>
              <option value="70">PyPy 3.10 (7.3.15, 64bit)</option>
              <option value="75">Rust 1.75.0 (2021)</option>
            </select>
            <span class="error for__programTypeId"></span>
          </td>
        </tr>
        <tr>
          <td>Source code:</td>
          <td>
            <textarea id="sourceCodeTextarea" name="source"></textarea>
            <span class="error for__source"></span>
          </td>
        </tr>
        <tr>
          <td>Or choose file:</td>
          <td><input type="file" name="sourceFile" /></td>
        </tr>
      </table>
      <input type="hidden" name="tabSize" value="4" />
      <input type="hidden" name="sourceCodeConfirmed" value="false" />
      <input class="submit" type="submit" value="Submit" />
    </form>
  </body>
</html>
